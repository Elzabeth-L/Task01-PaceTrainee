<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100" role="img" aria-labelledby="title desc">
  <title id="title">Orbit serverless landing page architecture</title>
  <desc id="desc">AWS infrastructure, Terraform delivery workflow, and Lambda request processing architecture.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7b7"/>
    </marker>
    <style>
      .title { font: 800 42px Inter, Segoe UI, sans-serif; fill: url(#titleGradient); letter-spacing: -1px; }
      .subtitle { font: 400 18px Inter, Segoe UI, sans-serif; fill: #94a3b8; }
      .section-title { font: 700 27px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .section-no { font: 800 15px Inter, Segoe UI, sans-serif; fill: #07111f; }
      .group-title { font: 700 18px Inter, Segoe UI, sans-serif; fill: #e2e8f0; }
      .box-title { font: 700 15px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .box-text { font: 400 13px Inter, Segoe UI, sans-serif; fill: #b8c4d6; }
      .tiny { font: 500 11px Inter, Segoe UI, sans-serif; fill: #94a3b8; }
      .step { font: 700 13px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .step-sub { font: 400 11px Inter, Segoe UI, sans-serif; fill: #a8b6ca; }
      .panel { fill: #0b1528; stroke: #263451; stroke-width: 1.5; rx: 24; }
      .group { fill: #0d1a31; stroke: #344563; stroke-width: 1.4; rx: 18; }
      .aws { fill: #17223a; stroke: #f59e0b; stroke-width: 1.5; rx: 12; }
      .iam { fill: #201a3b; stroke: #a78bfa; stroke-width: 1.5; rx: 12; }
      .state { fill: #0f2931; stroke: #34d399; stroke-width: 1.5; rx: 12; }
      .github { fill: #191c26; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .external { fill: #10243a; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
      .note { fill: #172033; stroke: #475569; stroke-width: 1; stroke-dasharray: 6 5; rx: 10; }
      .flow { fill: none; stroke: #7dd3fc; stroke-width: 2; marker-end: url(#arrow); }
      .flow-green { fill: none; stroke: #6ee7b7; stroke-width: 2; marker-end: url(#arrowGreen); }
      .flow-dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .divider { stroke: #263451; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="2100" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="230" fill="#312e81" opacity="0.18"/>
  <circle cx="120" cy="2020" r="270" fill="#164e63" opacity="0.16"/>

  <text x="70" y="72" class="title">Orbit Serverless Architecture</text>
  <text x="70" y="105" class="subtitle">Python 3.13 · AWS Lambda · API Gateway HTTP API · Terraform · GitHub Actions</text>
  <text x="1530" y="72" class="subtitle" text-anchor="end">AWS 598120810297 · ap-south-1</text>

  <!-- Section 1 -->
  <rect x="50" y="140" width="1500" height="870" class="panel" filter="url(#shadow)"/>
  <circle cx="85" cy="184" r="18" fill="#f59e0b"/>
  <text x="85" y="190" class="section-no" text-anchor="middle">1</text>
  <text x="118" y="193" class="section-title">AWS infrastructure — all deployed resources</text>

  <!-- Browser -->
  <rect x="85" y="365" width="175" height="92" class="external"/>
  <text x="172" y="397" class="box-title" text-anchor="middle">Web browser</text>
  <text x="172" y="421" class="box-text" text-anchor="middle">Public HTTPS client</text>
  <text x="172" y="441" class="tiny" text-anchor="middle">GET / or GET /path</text>

  <!-- Runtime group -->
  <rect x="315" y="235" width="650" height="720" class="group"/>
  <text x="342" y="270" class="group-title">APPLICATION RUNTIME</text>
  <text x="938" y="270" class="tiny" text-anchor="end">10 Terraform resources</text>

  <rect x="350" y="300" width="580" height="175" class="aws"/>
  <text x="375" y="329" class="box-title">API Gateway v2 HTTP API · orbit-site-dev-http-api</text>
  <line x1="375" y1="344" x2="905" y2="344" class="divider"/>
  <rect x="375" y="360" width="120" height="82" class="aws"/>
  <text x="435" y="384" class="box-title" text-anchor="middle">$default</text>
  <text x="435" y="404" class="tiny" text-anchor="middle">auto deploy</text>
  <text x="435" y="422" class="tiny" text-anchor="middle">25/s · burst 50</text>
  <rect x="510" y="360" width="120" height="82" class="aws"/>
  <text x="570" y="384" class="box-title" text-anchor="middle">GET /</text>
  <text x="570" y="407" class="box-text" text-anchor="middle">root route</text>
  <rect x="645" y="360" width="120" height="82" class="aws"/>
  <text x="705" y="384" class="box-title" text-anchor="middle">GET /{proxy+}</text>
  <text x="705" y="407" class="box-text" text-anchor="middle">proxy route</text>
  <rect x="780" y="360" width="125" height="82" class="aws"/>
  <text x="842" y="384" class="box-title" text-anchor="middle">AWS_PROXY</text>
  <text x="842" y="404" class="tiny" text-anchor="middle">payload 2.0</text>
  <text x="842" y="422" class="tiny" text-anchor="middle">5 s integration</text>

  <rect x="435" y="510" width="410" height="105" class="aws"/>
  <text x="640" y="542" class="box-title" text-anchor="middle">Lambda · orbit-site-dev</text>
  <text x="640" y="568" class="box-text" text-anchor="middle">Python 3.13 · ARM64 · 128 MB · 5-second timeout</text>
  <text x="640" y="591" class="tiny" text-anchor="middle">lambda_function.lambda_handler · APP_ENVIRONMENT=dev</text>

  <rect x="350" y="655" width="265" height="105" class="iam"/>
  <text x="482" y="685" class="box-title" text-anchor="middle">Lambda execution role</text>
  <text x="482" y="708" class="box-text" text-anchor="middle">orbit-site-dev-lambda-role</text>
  <text x="482" y="733" class="tiny" text-anchor="middle">trusted service: lambda.amazonaws.com</text>

  <rect x="665" y="655" width="265" height="105" class="iam"/>
  <text x="797" y="685" class="box-title" text-anchor="middle">Inline logs policy</text>
  <text x="797" y="708" class="box-text" text-anchor="middle">cloudwatch-logs</text>
  <text x="797" y="733" class="tiny" text-anchor="middle">CreateLogStream · PutLogEvents</text>

  <rect x="350" y="800" width="265" height="105" class="aws"/>
  <text x="482" y="830" class="box-title" text-anchor="middle">CloudWatch Logs</text>
  <text x="482" y="853" class="box-text" text-anchor="middle">/aws/lambda/orbit-site-dev</text>
  <text x="482" y="878" class="tiny" text-anchor="middle">14-day retention</text>

  <rect x="665" y="800" width="265" height="105" class="iam"/>
  <text x="797" y="830" class="box-title" text-anchor="middle">Lambda permission</text>
  <text x="797" y="853" class="box-text" text-anchor="middle">AllowApiGatewayInvoke</text>
  <text x="797" y="878" class="tiny" text-anchor="middle">scoped to this API execution ARN</text>

  <path d="M260 411 H350" class="flow"/>
  <path d="M640 475 V510" class="flow"/>
  <path d="M535 615 L490 655" class="flow-dash"/>
  <path d="M665 707 H615" class="flow-dash"/>
  <path d="M482 760 V800" class="flow-dash"/>
  <path d="M797 800 V780 H945 V562 H845" class="flow-dash"/>

  <!-- Delivery group -->
  <rect x="1005" y="235" width="505" height="720" class="group"/>
  <text x="1032" y="270" class="group-title">STATE &amp; CI IDENTITY</text>
  <text x="1480" y="270" class="tiny" text-anchor="end">7 managed + 1 shared dependency</text>

  <rect x="1040" y="300" width="200" height="85" class="github"/>
  <text x="1140" y="330" class="box-title" text-anchor="middle">GitHub Actions</text>
  <text x="1140" y="353" class="box-text" text-anchor="middle">Task01-PaceTrainee</text>
  <text x="1140" y="371" class="tiny" text-anchor="middle">protected dev environment</text>

  <rect x="1275" y="300" width="200" height="85" class="note"/>
  <text x="1375" y="326" class="box-title" text-anchor="middle">GitHub OIDC provider</text>
  <text x="1375" y="349" class="box-text" text-anchor="middle">shared account resource</text>
  <text x="1375" y="369" class="tiny" text-anchor="middle">read-only data source</text>

  <rect x="1040" y="430" width="435" height="95" class="iam"/>
  <text x="1257" y="460" class="box-title" text-anchor="middle">IAM role · orbit-site-github-actions</text>
  <text x="1257" y="484" class="box-text" text-anchor="middle">STS AssumeRoleWithWebIdentity</text>
  <text x="1257" y="504" class="tiny" text-anchor="middle">repo + environment subject restriction</text>

  <rect x="1040" y="555" width="435" height="95" class="iam"/>
  <text x="1257" y="585" class="box-title" text-anchor="middle">Inline policy · terraform-application-deploy</text>
  <text x="1257" y="609" class="box-text" text-anchor="middle">State · Lambda · API Gateway · Logs · app IAM roles</text>
  <text x="1257" y="629" class="tiny" text-anchor="middle">cannot modify its own OIDC trust role</text>

  <rect x="1040" y="680" width="435" height="225" class="state"/>
  <text x="1065" y="711" class="box-title">S3 · orbit-site-tfstate-598120810297-ap-south-1</text>
  <line x1="1065" y1="726" x2="1450" y2="726" class="divider"/>
  <text x="1065" y="754" class="box-text">1. Bucket resource with prevent_destroy</text>
  <text x="1065" y="779" class="box-text">2. Versioning enabled</text>
  <text x="1065" y="804" class="box-text">3. AES-256 server-side encryption</text>
  <text x="1065" y="829" class="box-text">4. All public access blocked</text>
  <text x="1065" y="854" class="box-text">5. Bucket policy denies non-TLS requests</text>
  <text x="1065" y="882" class="tiny">State: orbit/dev/terraform.tfstate · Lock: terraform.tfstate.tflock</text>

  <path d="M1240 342 H1275" class="flow"/>
  <path d="M1375 385 L1290 430" class="flow"/>
  <path d="M1257 525 V555" class="flow"/>
  <path d="M1257 650 V680" class="flow-green"/>
  <path d="M1040 602 H965" class="flow"/>

  <!-- Section 2 -->
  <rect x="50" y="1040" width="1500" height="570" class="panel" filter="url(#shadow)"/>
  <circle cx="85" cy="1084" r="18" fill="#22d3ee"/>
  <text x="85" y="1090" class="section-no" text-anchor="middle">2</text>
  <text x="118" y="1093" class="section-title">Terraform workflow — local first, pipeline second</text>

  <text x="85" y="1140" class="group-title">ONE-TIME LOCAL BOOTSTRAP</text>
  <g>
    <rect x="85" y="1160" width="190" height="75" class="state"/>
    <text x="180" y="1190" class="step" text-anchor="middle">Bootstrap init &amp; plan</text>
    <text x="180" y="1213" class="step-sub" text-anchor="middle">local state</text>
    <rect x="325" y="1160" width="190" height="75" class="state"/>
    <text x="420" y="1190" class="step" text-anchor="middle">Bootstrap apply</text>
    <text x="420" y="1213" class="step-sub" text-anchor="middle">S3 + GitHub role</text>
    <rect x="565" y="1160" width="190" height="75" class="state"/>
    <text x="660" y="1190" class="step" text-anchor="middle">Package Lambda</text>
    <text x="660" y="1213" class="step-sub" text-anchor="middle">orbit-site.zip</text>
    <rect x="805" y="1160" width="190" height="75" class="state"/>
    <text x="900" y="1190" class="step" text-anchor="middle">App init + plan</text>
    <text x="900" y="1213" class="step-sub" text-anchor="middle">S3 backend + saved plan</text>
    <rect x="1045" y="1160" width="190" height="75" class="state"/>
    <text x="1140" y="1190" class="step" text-anchor="middle">Local apply</text>
    <text x="1140" y="1213" class="step-sub" text-anchor="middle">10 app resources</text>
    <rect x="1285" y="1160" width="190" height="75" class="external"/>
    <text x="1380" y="1190" class="step" text-anchor="middle">Verify HTTP 200</text>
    <text x="1380" y="1213" class="step-sub" text-anchor="middle">initial live page</text>
    <path d="M275 1197 H325" class="flow-green"/><path d="M515 1197 H565" class="flow-green"/>
    <path d="M755 1197 H805" class="flow-green"/><path d="M995 1197 H1045" class="flow-green"/>
    <path d="M1235 1197 H1285" class="flow-green"/>
  </g>

  <text x="85" y="1290" class="group-title">GITHUB ACTIONS CONTINUOUS DELIVERY</text>
  <g>
    <rect x="85" y="1310" width="165" height="90" class="github"/>
    <text x="167" y="1340" class="step" text-anchor="middle">Push master</text>
    <text x="167" y="1363" class="step-sub" text-anchor="middle">or workflow_dispatch</text>
    <text x="167" y="1381" class="step-sub" text-anchor="middle">PR = checks only</text>
    <rect x="285" y="1310" width="175" height="90" class="github"/>
    <text x="372" y="1337" class="step" text-anchor="middle">Test &amp; validate</text>
    <text x="372" y="1360" class="step-sub" text-anchor="middle">unit test · package · fmt</text>
    <text x="372" y="1378" class="step-sub" text-anchor="middle">init offline · validate</text>
    <rect x="495" y="1310" width="165" height="90" class="github"/>
    <text x="577" y="1340" class="step" text-anchor="middle">dev environment</text>
    <text x="577" y="1363" class="step-sub" text-anchor="middle">master branch policy</text>
    <rect x="695" y="1310" width="165" height="90" class="iam"/>
    <text x="777" y="1340" class="step" text-anchor="middle">OIDC assume role</text>
    <text x="777" y="1363" class="step-sub" text-anchor="middle">temporary AWS session</text>
    <rect x="895" y="1310" width="165" height="90" class="state"/>
    <text x="977" y="1340" class="step" text-anchor="middle">Remote init</text>
    <text x="977" y="1363" class="step-sub" text-anchor="middle">read state + acquire lock</text>
    <rect x="1095" y="1310" width="165" height="90" class="aws"/>
    <text x="1177" y="1340" class="step" text-anchor="middle">Plan then apply</text>
    <text x="1177" y="1363" class="step-sub" text-anchor="middle">exact saved tfplan</text>
    <rect x="1295" y="1310" width="180" height="90" class="external"/>
    <text x="1385" y="1340" class="step" text-anchor="middle">Publish &amp; verify</text>
    <text x="1385" y="1363" class="step-sub" text-anchor="middle">state update · unlock</text>
    <text x="1385" y="1381" class="step-sub" text-anchor="middle">site URL summary</text>
    <path d="M250 1355 H285" class="flow"/><path d="M460 1355 H495" class="flow"/>
    <path d="M660 1355 H695" class="flow"/><path d="M860 1355 H895" class="flow"/>
    <path d="M1060 1355 H1095" class="flow"/><path d="M1260 1355 H1295" class="flow"/>
  </g>

  <rect x="85" y="1450" width="1390" height="105" class="note"/>
  <text x="110" y="1480" class="box-title">Safety controls</text>
  <text x="110" y="1507" class="box-text">GitHub concurrency group terraform-dev serializes deployments · S3 native lock blocks concurrent state writers · PRs receive no AWS identity</text>
  <text x="110" y="1533" class="box-text">No long-lived AWS keys in GitHub · source hash detects real code changes · protected dev environment limits deployment to master</text>

  <!-- Section 3 -->
  <rect x="50" y="1640" width="1500" height="400" class="panel" filter="url(#shadow)"/>
  <circle cx="85" cy="1684" r="18" fill="#a78bfa"/>
  <text x="85" y="1690" class="section-no" text-anchor="middle">3</text>
  <text x="118" y="1693" class="section-title">Lambda functioning — one stateless request</text>

  <rect x="85" y="1745" width="180" height="100" class="external"/>
  <text x="175" y="1777" class="box-title" text-anchor="middle">1 · Browser</text>
  <text x="175" y="1801" class="box-text" text-anchor="middle">HTTPS GET</text>
  <text x="175" y="1824" class="tiny" text-anchor="middle">/ or /path</text>

  <rect x="330" y="1745" width="210" height="100" class="aws"/>
  <text x="435" y="1777" class="box-title" text-anchor="middle">2 · API Gateway</text>
  <text x="435" y="1801" class="box-text" text-anchor="middle">match route</text>
  <text x="435" y="1824" class="tiny" text-anchor="middle">create payload v2 event</text>

  <rect x="605" y="1745" width="200" height="100" class="iam"/>
  <text x="705" y="1777" class="box-title" text-anchor="middle">3 · Permission</text>
  <text x="705" y="1801" class="box-text" text-anchor="middle">validate source ARN</text>
  <text x="705" y="1824" class="tiny" text-anchor="middle">allow Lambda invoke</text>

  <rect x="870" y="1725" width="300" height="140" class="aws"/>
  <text x="1020" y="1757" class="box-title" text-anchor="middle">4 · Python handler</text>
  <text x="1020" y="1783" class="box-text" text-anchor="middle">read and escape request ID</text>
  <text x="1020" y="1807" class="box-text" text-anchor="middle">build responsive HTML + CSS</text>
  <text x="1020" y="1831" class="tiny" text-anchor="middle">no DB · no network · no filesystem · no SDK</text>
  <text x="1020" y="1850" class="tiny" text-anchor="middle">platform logs → CloudWatch</text>

  <rect x="1235" y="1745" width="240" height="100" class="external"/>
  <text x="1355" y="1777" class="box-title" text-anchor="middle">5 · HTTP response</text>
  <text x="1355" y="1801" class="box-text" text-anchor="middle">200 · text/html</text>
  <text x="1355" y="1824" class="tiny" text-anchor="middle">CSP · nosniff · cache 300s</text>

  <path d="M265 1795 H330" class="flow"/><path d="M540 1795 H605" class="flow"/>
  <path d="M805 1795 H870" class="flow"/><path d="M1170 1795 H1235" class="flow"/>
  <path d="M1355 1845 C1355 1960 175 1960 175 1845" class="flow-green"/>
  <text x="765" y="1908" class="box-text" text-anchor="middle">API Gateway converts the Lambda proxy result into the browser response</text>

  <text x="70" y="2072" class="tiny">Source of truth: terraform/bootstrap · terraform/modules/serverless_site · terraform/environments/dev · .github/workflows/terraform.yml</text>
  <text x="1530" y="2072" class="tiny" text-anchor="end">Orbit architecture · generated as editable SVG</text>
</svg>
